<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto - Javadaba Miedo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar Dinámico -->
    <div id="espacio-navbar"></div>

    <div class="container-fluid my-4 flex-grow-1">
        <div class="row align-items-center">
            
            <!-- Columna Izquierda: -->
            <div class="col-md-2 d-none d-md-flex align-items-center justify-content-center p-3 border-end">
                <img src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=400&q=80" alt="Publicidad de Terror" class="img-fluid rounded shadow">
            </div>

            <!-- Columna Central: Formulario -->
            <div class="col-md-8 p-4">
                <h2 class="text-center mb-4 titulo-principal fw-bold">¿Tienes una historia que no te deja dormir?</h2>
                
                <!-- Contenedor para la alerta dinámica en vivo -->
                <div id="contactoAlertPlaceholder"></div>

                <form id="formularioContacto" class="mt-3">
                    <div class="mb-3">
                        <label for="inputEmail" class="form-label fw-semibold">Correo electrónico</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="tu@correo.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="inputMensaje" class="form-label fw-semibold">Envía tu relato o mensaje</label>
                        <textarea class="form-control" id="inputMensaje" rows="6" placeholder="Escribe aquí tu peor pesadilla..." required></textarea>
                    </div>
                    
                    <div class="text-center">
                        <button type="submit" class="btn btn-personalizado px-4 py-2">Enviar relato</button>
                    </div>
                </form>
            </div>

            <!-- Columna Derecha: -->
            <div class="col-md-2 d-none d-md-flex align-items-center justify-content-center p-3 border-start">
                <img src="https://images.unsplash.com/photo-1535905557558-afc4877a26fc?w=400&q=80" alt="Noticias Macabras" class="img-fluid rounded shadow">
            </div>

        </div>
    </div>

    <!-- Footer Dinámico -->
    <div id="contenedor-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
